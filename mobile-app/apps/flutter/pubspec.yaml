name: pai_mobile_flutter
description: "Flutter mobile client for Personal AI Infrastructure."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.7
  dartssh2: ^2.17.1
  dynamic_color: ^1.7.0
  pinenacl: ^0.6.0
  flutter_highlight: ^0.7.0
  flutter_secure_storage: ^9.2.2
  http: ^1.2.0
  intl: ^0.20.2
  local_auth: ^3.0.1
  markdown: ^7.2.2
  permission_handler: ^11.3.1
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  file_picker: ^8.1.6
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  flutter_local_notifications: ^21.0.0
  xterm: ^4.0.0
  web_socket_channel: ^3.0.3
  flutter_foreground_task: ^9.2.2
  flutter_tts: ^4.2.5
  flutter_markdown_plus: ^1.0.7
  animations: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  flutter_lints: ^4.0.0
  local_auth_platform_interface: ^1.0.10
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    - family: JetBrainsMonoNerdFont
      fonts:
        - asset: assets/fonts/JetBrainsMonoNerdFontMono-Regular.ttf

# App launcher icon. Regenerate after changing the source art with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
  min_sdk_android: 21
