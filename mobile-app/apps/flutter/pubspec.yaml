name: pai_mobile_flutter
description: "Flutter mobile client for Personal AI Infrastructure."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_ai_toolkit: ^0.7.0
  flutter_highlight: ^0.7.0
  flutter_markdown: ^0.7.6+2
  flutter_secure_storage: ^9.2.2
  http: ^1.2.0
  intl: ^0.19.0
  markdown: ^7.2.2
  permission_handler: ^11.3.1
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  file_picker: ^8.1.6
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
