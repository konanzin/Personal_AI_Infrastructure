# PAI Security Patterns — EXAMPLE / SEED TEMPLATE (OpenCode port)
#
# This is the canonical, versioned policy. install.sh seeds it to
# ~/.config/opencode/PAI/USER/SECURITY/PATTERNS.yaml (user-owned, gitignored)
# when no user policy exists. Edit the installed copy to customize.
#
# DESIGN: Block catastrophic ops (deny), alert on suspicious (log + allow),
# fast-path trusted tools. NO bash "confirm" tier — confirmation survives only
# for path tiers, surfaced via OpenCode's native permission prompt.
#
# LOADING CASCADE (see plugins/lib/pai-hooks.lib.js loadSecurityPolicy):
#   1. installed USER/SECURITY/PATTERNS.yaml → parse + compile
#   2. file absent             → bundled default policy in the plugin
#   3. file present but corrupt → FAIL-CLOSED (deny gated tools, except
#      read/write to the policy file so it can be repaired)
#
# Pattern syntax: JavaScript RegExp source, matched case-insensitively anywhere
# in the command. Edit with care — a corrupt file fails closed.
# version is the STALENESS signal: install.sh --check compares this against the
# installed copy and flags drift. Bump it whenever patterns change here.
version: "3.4-opencode"

bash:
  trusted:
    - pattern: '^playwright-cli\b'
      reason: 'Playwright CLI (Browser skill)'
    - pattern: '^bunx playwright\b'
      reason: 'Playwright one-shot (Browser skill)'
    - pattern: '^agent-browser\b'
      reason: 'agent-browser CLI (Browser skill)'
  blocked:
    # Terminator class ["']?(\s|$|;|&&|\|) tolerates a closing quote (bash -c 'rm -rf /')
    # and a trailing glob (`/*` wipes the same tree `/` does but used to slip to alert).
    - pattern: 'rm\s.*-\w*r.*\s+["'']?/\*?["'']?(\s|$|;|&&|\|)'
      reason: 'Recursive deletion of system root (/ or /*)'
    - pattern: 'rm\s.*-\w*r.*\s+["'']?~(/\*?)?["'']?(\s|$|;|&&|\|)'
      reason: 'Recursive deletion of home directory (~ or ~/*)'
    - pattern: 'rm\s.*-\w*r.*\s+["'']?\$\{?HOME\}?(/\*?)?["'']?(\s|$|;|&&|\|)'
      reason: 'Recursive deletion of home directory ($HOME or $HOME/*)'
    # /home, /home/<user>, and their /* forms wipe an entire home tree; deeper
    # paths (/home/user/proj) fall through to the recursive-rm alert tier.
    - pattern: 'rm\s.*-\w*r.*\s+["'']?/home(/[^/\s*]+)?/?\*?["'']?(\s|$|;|&&|\|)'
      reason: 'Recursive deletion of a home tree (/home...)'
    - pattern: 'rm\s.*-\w*r.*\s+["'']?/(etc|usr|var|boot|bin|sbin|lib(64)?|opt|srv|root)/?\*?["'']?(\s|$|;|&&|\|)'
      reason: 'Recursive deletion of a top-level system directory'
    # Non-rm catastrophic deletion: find -delete rooted at /, ~, $HOME or a whole
    # home dir (deeper roots like /home/user/tmp are legitimate cleanup).
    - pattern: '\bfind\s+["'']?(/home(/[^/\s]+)?/?|/|~/?|\$\{?HOME\}?/?)["'']?\s[^|;&]*-delete\b'
      reason: 'find -delete across root or an entire home directory'
    - pattern: '(^|[;&|]\s*|\bsudo\s+)shred\b'
      reason: 'Irrecoverable file destruction (shred)'
    # git clean needs BOTH -x (include ignored) and force to be destructive-and-run.
    # -n/--dry-run anywhere makes it a safe preview even alongside -xf, so it is
    # exempted up front; plain `git clean -fd` stays at the alert tier.
    - pattern: 'git\s+clean\b(?![^|;&]*\s(-[a-z]*n[a-z]*|--dry-run)\b)(?=[^|;&]*\s-[a-z]*x)(?=[^|;&]*\s(-[a-z]*f|--force))'
      reason: 'git clean -x removes ignored+untracked files irrecoverably'
    - pattern: 'rm\s.*-\w*r.*\s(~|\$\{?HOME\}?)/\.config/opencode(/|\s|$|;|&&)'
      reason: 'Recursive deletion of ~/.config/opencode (entire PAI infrastructure)'
    - pattern: 'rm\s.*-\w*r.*\s+~/Projects/?(\s|$|;|&&)'
      reason: 'Recursive deletion of ~/Projects'
    - pattern: 'rm\s.*(PATTERNS\.yaml|pai-hooks(\.lib)?\.js)'
      reason: 'Deletion of PAI security policy/plugin disables protection'
    - pattern: ':\(\)\s*\{\s*:\|:&\s*\};:'
      reason: 'Fork bomb'
    - pattern: 'mkfs(\.|\b)'
      reason: 'Filesystem format/wipe (mkfs)'
    - pattern: 'dd\s+if=/dev/zero'
      reason: 'Disk overwrite with zeros (dd if=/dev/zero)'
    - pattern: 'dd\s+if=.*of=/dev/(sd|hd|nvme)'
      reason: 'dd to disk device'
    - pattern: '>\s*/dev/(sd|hd|nvme)'
      reason: 'Redirect to disk device'
    - pattern: 'diskutil\s+(eraseDisk|zeroDisk|apfs\s+(deleteContainer|eraseVolume))'
      reason: 'Disk/volume destruction (diskutil)'
    - pattern: 'chmod\s+-R\s+777\s+/'
      reason: 'chmod 777 on root'
    - pattern: 'chown\s+-R\s+.*\s+/(\s|$)'
      reason: 'chown -R on root'
    - pattern: 'gh\s+repo\s+delete'
      reason: 'GitHub repository deletion'
    - pattern: 'gh\s+repo\s+edit\b.*--visibility\s+public'
      reason: 'Repository visibility changed to public'
    - pattern: '(curl|wget|fetch|aria2c|httpie)\s+[^|]*\|\s*(sh|bash|zsh)\b'
      reason: 'Piping HTTP downloader output to shell interpreter'
    # ── Credential access via shell (deny — matches original PAI) ──
    # Matches only real dotenv secret files: the token must START a path segment
    # with `.env` (so foo.env / app.env.example don't match) and any extension
    # chain must not end in a template suffix (.env.sample/.example/.template/.dist
    # are secretless by convention; .env.local/.env.production are secrets).
    - pattern: '\b(cat|grep|rg|sed|awk|source|less|head|tail)\b[^|;&]*[\s"''=/]\.env(\.(?!example\b|sample\b|template\b|dist\b)[\w-]+)*(?=$|[\s"'';|&)])'
      reason: 'Reading .env via shell (use Read tool or secrets utility)'
    # ── Curated high-severity adds (harvested from opencode-policy, MIT) ──
    # Selective: only low-false-positive catastrophic signatures the base
    # pattern set lacked (crypto miners, reverse shells).
    - pattern: '\bxmrig\b'
      reason: 'Crypto miner (xmrig)'
    - pattern: '\b(cpuminer|minerd|ccminer|ethminer)\b'
      reason: 'Crypto miner'
    - pattern: 'stratum\+(tcp|ssl)://'
      reason: 'Mining pool connection (stratum)'
    - pattern: '\bnc(at)?\b[^|;&\n]*\s-[a-zA-Z]*e\b'
      reason: 'netcat with -e/execute (reverse shell)'
    - pattern: '\bsocat\b[^|;&\n]*exec:'
      reason: 'socat exec reverse shell'
    - pattern: '(>&?|<)\s*/dev/(tcp|udp)/'
      reason: 'Bash /dev/tcp reverse shell'
    - pattern: '\bperl\b.*[Ss]ocket.*connect'
      reason: 'Perl reverse shell'
    - pattern: '\bruby\b.*TCPSocket'
      reason: 'Ruby reverse shell'
    - pattern: '\bphp\b.*fsockopen'
      reason: 'PHP reverse shell'
  alert:
    - pattern: 'rm\s+.*-\w*[rR]'
      reason: 'Recursive rm (logged for audit)'
    - pattern: 'git\s+push\b.*(--force|\s-f\b)'
      reason: 'Force push (audit)'
    - pattern: 'git\s+reset\s+--hard'
      reason: 'Hard reset (audit)'
    - pattern: 'git\s+clean\b[^|;&]*\s(-[a-z]*f[a-z]*|--force)\b'
      reason: 'Force clean of untracked files (audit)'
    - pattern: '\bDROP\s+(DATABASE|TABLE)\b'
      reason: 'Destructive SQL (audit)'
    - pattern: '\bTRUNCATE\b'
      reason: 'Table truncate (audit)'
    - pattern: 'terraform\s+destroy'
      reason: 'Infrastructure destruction (audit)'
    - pattern: '\b(nc|ncat|socat)\s'
      reason: 'Netcat/socat usage (exfil risk, audit)'
    - pattern: '\bsendmail\b'
      reason: 'Direct sendmail usage (exfil risk, audit)'
    - pattern: '(curl|wget)\b.*(-X\s*POST|--data|--post-data|--post-file|\s-d\s)'
      reason: 'Outbound HTTP POST (audit)'
    - pattern: '^(printenv|env)\s*$'
      reason: 'Full environment dump (audit)'
    - pattern: '^set\s*$'
      reason: 'Shell variable dump (audit)'
    - pattern: 'eval\s*[\(`"]'
      reason: 'eval usage (audit)'
    - pattern: 'python3?\s+-c\s'
      reason: 'Python inline execution (audit)'
    - pattern: 'node\s+-e\s'
      reason: 'Node inline execution (audit)'
    - pattern: 'ruby\s+-e\s'
      reason: 'Ruby inline execution (audit)'
    - pattern: 'perl\s+-e\s'
      reason: 'Perl inline execution (audit)'
    - pattern: 'npm\s+.*--unsafe-perm'
      reason: 'npm --unsafe-perm (audit)'

paths:
  # block read + write + delete
  zeroAccess:
    - '~/.ssh/id_*'
    - '~/.ssh/*.pem'
    - '~/.aws/credentials'
    - '~/.gnupg/**'
    - '**/service-account*.json'
    - '/etc/shadow'
    - '/etc/gshadow'
    - '/proc/kcore'
    - '/etc/ssl/private/**'
    # CREDENTIAL stores deny — machine-readable secrets whose exposure is
    # catastrophic and whose legitimate use never requires the model to read
    # them raw (tools/scripts mediate them).
    - '~/.config/opencode/auth.json'
    - '~/.local/share/opencode/auth.json'
    - '~/.claude/.credentials.json'
    - '~/.config/claude/credentials.json'
    - '~/.config/gh/hosts.yml'
    - '~/.config/opencode/PAI/USER/Config/PAI_CONFIG.yaml'
    # PERSONAL context (CONTACTS, FINANCES, HEALTH, BUSINESS, OUR_STORY,
    # voice.env) is deliberately NOT denied (policy 3.4, Principal's call
    # 2026-07-06): a Life OS assistant that cannot know its Principal is
    # capped where it matters most; what it does with that context is
    # governed by the Principal's own prompts. Egress and secret-content
    # floors still catch anything key-shaped leaving.
    - '**/.env'
    - '**/.env.*'
    # Exemptions ('!'): dotenv TEMPLATES are secretless by convention and must
    # stay readable/writable — mirrors the bash-side .env guard's suffix carve-out.
    # They pierce only the floating '**/.env*' globs above; anchored dirs
    # (/etc/ssl/private/**, ~/.gnupg/**) still deny template-named files inside.
    - '!**/.env.example'
    - '!**/.env.sample'
    - '!**/.env.template'
    - '!**/.env.dist'
    - '!**/.env.*.example'
    - '!**/.env.*.sample'
    - '!**/.env.*.template'
    - '!**/.env.*.dist'
  # log + allow on read/write (empty: .env reads are denied above, matching original PAI)
  alertAccess: []
  # require approval (native prompt) on read/write
  confirmAccess:
    - '~/.config/opencode/.mcp.json'
  # block write + delete (reads allowed)
  readOnly:
    - '/etc/**'
    # authorized_keys is world-readable by design but writing it = SSH backdoor.
    - '~/.ssh/authorized_keys*'
    - '~/.config/opencode/PAI/USER/SECURITY/PATTERNS.yaml'
    - '~/.config/opencode/plugins/pai-hooks.js'
    - '~/.config/opencode/plugins/lib/**'
  # block delete only
  noDelete:
    - '~/.config/opencode/PAI/**'
    - '~/.config/opencode/plugins/**'
    - '**/.git/**'
  # require approval on write (.env omitted: zeroAccess denies its write/delete too)
  confirmWrite:
    - '**/.npmrc'
    - '**/.pypirc'
    - '**/id_rsa'
    - '**/id_ed25519'
    - '**/.htpasswd'
