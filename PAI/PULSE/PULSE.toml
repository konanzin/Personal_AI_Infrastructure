# PAI Pulse — OpenCode Optional Broker Configuration
#
# Current OpenCode scope:
# - pai-hooks writes human-relevant events to notifications.jsonl.
# - pai_notify is the explicit final speech contract.
# - pulse-broker.ts is an optional fan-out runtime for mobile/desktop renderers.
# - A running broker is not required for install success.
#
# Legacy desktop Pulse features from the original PAI are out of scope here:
# dashboard Next app, macOS MenuBar app, ElevenLabs VoiceServer, Telegram/iMessage
# bots, cron heartbeat daemon, and AI reasoning jobs.

schema_version = 1
runtime = "opencode"
status = "optional-broker"

[stream]
path = "~/.config/opencode/PAI/MEMORY/OBSERVABILITY/notifications.jsonl"
contract = "opencode/docs/NOTIFICATIONS_STREAM.md"
producer = "opencode/plugins/lib/pai-hooks.lib.js"

[producer]
final_voice_tool = "pai_notify"
visible_completed_line_parsed = false
language_required_for_speech = true

[broker]
enabled_by_default = false
host = "127.0.0.1"
port = 31337
command = "bun ~/.config/opencode/PAI/broker/pulse-broker.ts --port 31337"
health_paths = ["/health", "/api/pulse/health"]
systemd_user_unit = "~/.config/systemd/user/pulse-broker.service"

[legacy_notify]
endpoint = "POST /notify"
purpose = "compatibility for inherited startup/progress messages"
speaking_payload_requires_language = true
voice_enabled_false_is_dashboard_only = true

[renderers.mobile]
status = "planned-primary-consumer"
transport = "SSE /subscribe"
presence = "POST /presence"

[renderers.desktop]
status = "reference-dev-consumer"
entrypoint = "~/.config/opencode/PAI/broker/renderer-desktop.ts"
default_tts_provider = "edge_tts"
tts_override_env = "PULSE_TTS_CMD"

[jobs]
enabled = false
reason = "The OpenCode port does not ship the legacy Pulse cron daemon or the helpers those jobs required."
deferred_helpers = [
  "SessionHarvester.ts",
  "KnowledgeHarvester.ts",
  "LearningPatternSynthesis.ts",
  "CostTracker.ts",
  "ComputeGap.ts",
  "StalenessReview.ts"
]
